async function create(mode,back){const code=Math.random().toString(36).slice(2,8).toUpperCase();const d={mode,host:acct.name,players:[acct.name],state:'lobby'};const key=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');try{await sb('rpc/ot_create',{method:'POST',body:JSON.stringify({_code:code,_key:key,_data:d})});OT.key=key}catch(e){ovShow('<p>Não foi possível falar com o servidor. Verifique a internet.</p>',[['Voltar',back||onlineTournamentMenu]],true);return}OT.code=code;persist();currentRoomId='OT:'+code;otShow()}
window.onlineTournamentMenu=function(){if(OT.code&&acct){otShow();return}if(!acct){ovShow('<h2>🏆 Online</h2><p>Entre na sua conta primeiro.</p>',[['Entrar / criar conta',acctMenu],['Voltar',()=>{tov.style.display='none'}]]);return}
 const lr=lastRoom();ovShow('<h2>Escolher modo</h2><input id="otc" maxlength="8" placeholder="Código da sala">',[
 ...(lr&&lr.code?[['↩ Continuar torneio anterior (online)',continueLast]]:[]),
 ['📈 Campanha (online)',()=>chooseMode('carreira')],['🏆 Torneio',()=>chooseMode('torneio')],
 ['Entrar com código',()=>{const c=document.getElementById('otc')?.value;if(c)otJoin(c)}],['Voltar',()=>{tov.style.display='none'}]])};
window.onlineSalaMenu=function(){if(OT.code&&acct){otShow();return}if(!acct){ovShow('<h2>⚽ Sala online</h2><p>Entre na sua conta primeiro.</p>',[['Entrar / criar conta',acctMenu],['Voltar',()=>{tov.style.display='none'}]]);return}
 ovShow('<h2>Escolher modo</h2><input id="otc" maxlength="8" placeholder="Código da sala">',[
 ['⚽ X1',()=>chooseMode('x1',onlineSalaMenu)],
 ['Entrar com código',()=>{const c=document.getElementById('otc')?.value;if(c)otJoin(c)}],['Voltar',()=>{tov.style.display='none'}]])};
function chooseMode(mode,back){ovShow('<h2>'+({carreira:'Campanha (online)',torneio:'Torneio',x1:'X1'})[mode]+'</h2>',[['Criar sala',()=>create(mode,back)],['Voltar',back||onlineTournamentMenu]],true,true)}
async function startLobby(){try{const d=await get(OT.code);if(!d||d.state!=='lobby'||d.players.length<2){if(d)render(d);return}begin(d);await put(OT.code,d);OT.last='';await tick()}catch(e){ovShow('<p>Não foi possível iniciar a sala. Tente novamente.</p>',[['Voltar à sala',otShow]],true,true)}}
function inviteList(d){let panel=document.getElementById('lobbyFriends');if(panel)panel.remove();panel=document.createElement('dialog');panel.id='lobbyFriends';panel.className='lobby-friends';const fs=friendsLoad();panel.innerHTML='<h2>Amigos</h2>'+(fs.length?'':'<p>Nenhum amigo adicionado.</p>')+'<div id="inviteStatus" role="status"></div>';fs.forEach(f=>{const row=document.createElement('div');row.className='friend-row';const name=document.createElement('span');name.textContent=f.nick;const add=document.createElement('button');add.textContent='＋';add.title='Convidar '+f.nick;add.setAttribute('aria-label','Convidar '+f.nick);add.onclick=()=>sendLobbyInvite(f,d,add,panel);row.append(name,add);panel.append(row)});const close=document.createElement('button');close.textContent='Voltar à sala';close.onclick=()=>panel.close();panel.append(close);document.body.append(panel);panel.addEventListener('close',()=>panel.remove());panel.showModal()}
async function sendLobbyInvite(f,d,button,panel){const status=panel.querySelector('#inviteStatus');button.disabled=true;try{await friendRpc('if_send',{_id:String(f.profileId||f.peer).toUpperCase(),_name:f.nick,_kind:'room',_payload:{code:OT.code,game:d.mode}});if(status)status.textContent='Convite entregue para '+f.nick+'. Aguardando resposta.'}catch(e){if(status)status.textContent='Não foi possível enviar. Confira o nick e o ID de perfil do amigo.'}finally{button.disabled=false}}
function playTest(info){OT.view=false;leaveNet();OT.match=info;OT.test=true;OT.done=false;OT.reported=false;OT.keep=tour;tour={season:1,phase:'test',lg:0,div:0,round:0,trophies:0};ovShow('<h2>Campanha (online)</h2>',[['Jogar partida-teste',nextMatch]],true,true)}
window.otFinishTest=async function(){if(OT.reported)return;OT.reported=true;const sa=S.p,sb2=S.c,s=st.p,n=Math.max(1,sa),prof=s.dir/n>=.5?'Atacante':s.def/n>=.4?'Defensor':s.out<=1?'Preciso':'Equilibrado';tour.prof=prof;tour.div=sa>=3?(sa-sb2>=2?2:1):0;tour.lg=Math.floor(Math.random()*4);tour.team=({Atacante:'Raios',Defensor:'Muralhas',Preciso:'Cirurgiões',Equilibrado:'Estrelas'})[prof]+' '+LG[tour.lg];tour.phase='div';tour.table=makeTable(tour);tour.playedOpps=[];saveT();const result={sa,sb:sb2,prof,team:tour.team,div:tour.div,lg:tour.lg};try{await sb('rpc/ot_career_test',{method:'POST',body:JSON.stringify({_code:OT.code,_pid:acct.pid,_pin:acct.pin,_result:result})});OT.done=true;ovShow('<h2>Partida-teste concluída</h2><p>'+esc(result.team)+' · '+DV[result.div]+'</p>',[['Voltar à sala',()=>{OT.test=false;OT.match=null;leaveNet();reset();otShow()}]],true,true)}catch(e){OT.reported=false;ovShow('<p>Não foi possível salvar o teste.</p>',[['Tentar novamente',window.otFinishTest]],true,true)}};
document.getElementById('b4').onclick=()=>{leaveNet();onlineSalaMenu()};

async function report(sa,sb2){const m=OT.match;if(!m)return;const a=m.imA?sa:sb2,b=m.imA?sb2:sa;try{await sb('rpc/ot_report',{method:'POST',body:JSON.stringify({_code:OT.code,_idx:m.i,_sa:a,_sb:b})})}catch(e){}}
function playBot(op,info){OT.view=false;leaveNet();const keep=tour;start(1);tour=null;oppName=op;lvl=.55;goal=5;OT.keep=keep;OT.match=info;OT.done=false;OT.reported=false;OT.bot=true;tov.style.display='none'}
async function loadPeer(){if(!window.Peer)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)})}
function matchTitle(d){return d.mode==='torneio'||d.phase==='ko'? 'Etapa':d.mode==='carreira'?'Rodada':'X1 online'}
const SBURL='https://fbzhklglohqnclsqiggy.supabase.co',SBKEY='sb_publishable_nlvnUamNtY3oCv2tFe8EEQ_yJS-9NuF';let RTC=null;
async function loadRT(){if(!window.supabase||!window.supabase.createClient)await new Promise((r,j)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';x.onload=r;x.onerror=j;document.head.appendChild(x)});if(!RTC)RTC=window.supabase.createClient(SBURL,SBKEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:60}}});return RTC}
function rtNet(id){const ch=RTC.channel(id,{config:{broadcast:{self:false}}});const emit=(t,d)=>{try{ch.send({type:'broadcast',event:t,payload:d})}catch(e){}return Promise.resolve()};return{ch,net:{emit,on:()=>{},leave:()=>{try{RTC.removeChannel(ch)}catch(e){}}}}}
const failMatch=()=>{leaveNet();OT.match=null;reset();ovShow('<p>Não foi possível conectar. Tente novamente.</p>',[['Voltar à sala',otShow]],true,true)};
async function hostMatch(id,info){OT.view=false;await loadRT();leaveNet();const {ch,net:n}=rtNet(id);net=n;let started=false;
 ch.on('broadcast',{event:'inp'},({payload})=>{if(net!==n)return;const d=payload||{};if(d.hello){if(!started){started=true;start(2);online='host';goal=5;OT.match=info;OT.done=false;OT.reported=false;OT.bot=false;tov.style.display='none'}return}if(!started)return;if(d.x!==undefined){ctl.c.vx=cl(+d.x||0,-1,1);ctl.c.vy=cl(+d.y||0,-1,1);ctl.c.kb=!!d.k}if(Number.isFinite(+d.px)&&Number.isFinite(+d.py)&&d.px!==undefined)window.__rp={x:+d.px,y:+d.py,mv:!!d.mv,t:performance.now()};if(d.b)press('c')});
 ch.subscribe(st=>{if(net===n&&!started&&(st==='CHANNEL_ERROR'||st==='TIMED_OUT'))failMatch()});
 ovShow('<h2>'+matchTitle(OT.data)+'</h2><p>Aguardando o outro jogador clicar em Iniciar...</p>',[['Cancelar',()=>{leaveNet();OT.match=null;reset();otShow()}]],true,true)}
async function guestMatch(id,info){OT.view=false;await loadRT();leaveNet();const {ch,net:n}=rtNet(id);net=n;
 online='guest';got=false;OT.match=info;OT.done=false;OT.reported=true;OT.bot=false;
 ovShow('<h2>'+matchTitle(OT.data)+'</h2><p>Aguardando o outro jogador clicar em Iniciar...</p>',[['Cancelar',()=>{leaveNet();OT.match=null;reset();otShow()}]],true,true);
 ch.on('broadcast',{event:'st'},({payload})=>{if(net===n&&payload)applySnap(payload)});
 ch.subscribe(st=>{if(net!==n)return;if(st==='SUBSCRIBED'){n.emit('inp',{hello:1});const iv=setInterval(()=>{if(net!==n||got){clearInterval(iv);return}n.emit('inp',{hello:1})},800)}else if(!got&&(st==='CHANNEL_ERROR'||st==='TIMED_OUT'))failMatch()})}
(function watch(){try{if(OT.match&&!OT.test&&!OT.done&&state==='over'){OT.done=true;const sa=S.p,sbb=S.c;if(!OT.reported){OT.reported=true;report(sa,sbb)}if(OT.bot){tour=OT.keep}
  setTimeout(()=>{ovShow('<h2>'+(sa>sbb?'Vitória':'Derrota')+' '+sa+' x '+sbb+'</h2><p>Resultado enviado ao torneio.</p>',[['Voltar ao torneio',()=>{leaveNet();reset();OT.match=null;otShow()}]])},600)}}catch(e){}requestAnimationFrame(watch)})();
if(OT.code){otShow()}
})();
